<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Landing page wireframe for a sprint coaching website">
  <rect width="640" height="400" fill="#0B0D0F"/>

  <!-- browser frame -->
  <rect x="120" y="60" width="400" height="280" rx="4" fill="#F0EFEA"/>
  <rect x="120" y="60" width="400" height="22" rx="4" fill="#D8D6CE"/>
  <circle cx="134" cy="71" r="3.5" fill="#55564F"/>
  <circle cx="146" cy="71" r="3.5" fill="#55564F"/>
  <circle cx="158" cy="71" r="3.5" fill="#55564F"/>

  <!-- header bar -->
  <rect x="120" y="82" width="400" height="22" fill="#0B0D0F"/>
  <text x="136" y="97" font-family="IBM Plex Mono, monospace" font-size="10" font-style="italic" font-weight="700" fill="#F0EFEA">MPI</text>
  <rect x="452" y="88" width="54" height="11" rx="1" fill="#C8500A"/>

  <!-- hero block -->
  <rect x="120" y="104" width="400" height="86" fill="#0B0D0F"/>
  <rect x="140" y="124" width="190" height="12" fill="#F0EFEA"/>
  <rect x="140" y="142" width="150" height="12" fill="#F0EFEA"/>
  <rect x="140" y="166" width="64" height="12" fill="#C8500A"/>

  <!-- sprint lane lines in hero -->
  <g stroke="#55564F" stroke-width="2">
    <line x1="380" y1="118" x2="500" y2="118"/>
    <line x1="380" y1="140" x2="500" y2="140"/>
    <line x1="380" y1="162" x2="500" y2="162"/>
    <line x1="380" y1="184" x2="500" y2="184"/>
  </g>
  <path d="M396 151 L424 151 M412 143 L424 151 L412 159" fill="none" stroke="#C8500A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mission band -->
  <rect x="120" y="190" width="400" height="18" fill="#C8500A"/>

  <!-- program cards -->
  <g fill="#FAFAF8" stroke="#D8D6CE">
    <rect x="140" y="222" width="112" height="70" rx="2"/>
    <rect x="264" y="222" width="112" height="70" rx="2"/>
    <rect x="388" y="222" width="112" height="70" rx="2"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="8" fill="#55564F" text-anchor="middle">
    <text x="196" y="262">YOUTH</text>
    <text x="320" y="262">HIGH SCHOOL</text>
    <text x="444" y="262">MASTERS</text>
  </g>

  <text x="320" y="370" font-family="IBM Plex Mono, monospace" font-size="10" fill="#55564F" text-anchor="middle">CONCEPT → BUILD → LAUNCH</text>
</svg>
